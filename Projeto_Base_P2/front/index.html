<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atividades Formativas</title>

  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">

        <a class="navbar-brand fw-bold" href="#inicio">
          Atividades Formativas
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Abrir menu">

          <span class="navbar-toggler-icon"></span>
        </button>

        <div id="menuPrincipal" class="collapse navbar-collapse">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="#inicio">Início</a>
            <a class="nav-link" href="#conteudo">Atividades</a>
            <a class="nav-link" href="#interacao">Cadastro</a>
          </div>
        </div>

      </div>
    </nav>
  </header>

  <main>

    <div id="inicio" class="container py-4">
      <h1>Painel de gestão</h1>
      <p id="mensagem" role="status" aria-live="polite"></p>

      <section id="conteudo" class="mb-5">
        <h2>Atividades cadastradas</h2>
        <div id="lista" class="row g-3"></div>
      </section>

      <section id="interacao">
        <h2 id="tituloForm">Nova atividade</h2>
        <form id="formulario" class="border rounded p-3 bg-white">
          <div class="mb-3">
            <label class="form-label" for="tipo">Tipo</label>
            <select class="form-select" id="tipo">
              <option value="curso">Curso</option>
              <option value="workshop">Workshop</option>
            </select>
          </div>
          <div class="mb-3" id="grupo-titulo">
            <label class="form-label" for="titulo">Título</label>
            <input class="form-control" id="titulo" type="text" pattern=".*\S.*" required>
          </div>
          <div class="mb-3" id="grupo-ano">
            <label class="form-label" for="ano">Ano</label>
            <input class="form-control" id="ano" type="number" min="0" required>
          </div>
          <div class="mb-3" id="grupo-responsavel">
            <label class="form-label" for="responsavel">Professor</label>
            <input class="form-control" id="responsavel" type="text" pattern=".*\S.*" required>
          </div>
          <div class="mb-3" id="grupo-horas">
            <label class="form-label" for="horas">Carga horária (horas)</label>
            <input class="form-control" id="horas" type="number" min="1" required>
          </div>
          <div class="mb-3" id="grupo-vagas">
            <label class="form-label" for="vagas">Vagas</label>
            <input class="form-control" id="vagas" type="number" min="1" required>
          </div>
          <div class="mb-3" id="grupo-local">
            <label class="form-label" for="local">Local</label>
            <input class="form-control" id="local" type="text" pattern=".*\S.*" required>
          </div>
          <button class="btn btn-primary" id="salvar">Salvar atividade</button>
          <button class="btn btn-outline-secondary" type="button" id="cancelar" hidden>Cancelar edição</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="border-top py-4 text-center text-secondary">
    <div class="container">
      Projeto prático — Desenvolvimento Web e Mobile I
    </div>
  </footer>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
